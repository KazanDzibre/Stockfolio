# Local infrastructure for Stockfolio development.
# Usage: docker compose up -d   |   docker compose down   |   docker compose down -v (also wipes data)

name: stockfolio

services:
    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            # Postgres 18+ expects the mount at /var/lib/postgresql (NOT .../data as in older versions)
            - postgres_data:/var/lib/postgresql
        healthcheck:
            # $$ = read the variable inside the container, not from Compose's .env at parse time
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    mongo:
        image: mongo:8
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        ports:
            - "127.0.0.1:${MONGO_PORT:-27017}:27017"
        volumes:
            - mongo_data:/data/db
        healthcheck:
            # ping doesn't require auth, so no credentials needed here
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    redis:
        image: redis:8
        restart: unless-stopped
        # Password even locally, so connection code is the same as in production.
        # appendonly = persist data to disk (Redis is in-memory by default).
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
    mongo_data:
    redis_data:
